name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Patch manifest
        run: |
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<item name="android:background">@null</item>|<item name="android:background">@null</item><item name="android:windowFullscreen">true</item>|' android/app/src/main/res/values/styles.xml

      - name: Apply app icon
        run: |
          pip install pillow
          python3 - <<'EOF'
          import os
          from PIL import Image, ImageDraw
          if os.path.exists('icon-512.png'):
              im = Image.open('icon-512.png').convert('RGBA')
              base = 'android/app/src/main/res'
              os.system(f'rm -rf {base}/mipmap-anydpi-v26')
              for k, v in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
                  d = f'{base}/mipmap-{k}'
                  r = im.resize((v, v), Image.LANCZOS)
                  r.save(f'{d}/ic_launcher.png')
                  m = Image.new('L', (v, v), 0)
                  ImageDraw.Draw(m).ellipse((0, 0, v-1, v-1), fill=255)
                  rr = r.copy(); rr.putalpha(m)
                  rr.save(f'{d}/ic_launcher_round.png')
            EOF

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tank1990-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: android/app/build/outputs/apk/debug/app-debug.apk
